<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1c2430">
    <title>Nullmeadow</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111821;
            font-family: Arial, Helvetica, sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            touch-action: none;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script src="claimrun.js"></script>
    <script src="invasion.js"></script>
    <script src="moonpond.js"></script>
    <script src="hollowroad.js"></script>
    <script src="runehand.js"></script>
    <script src="game.js"></script>
</body>
</html>
